<!-- i.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rishi Vardhan interactive 3D portfolio experience" />
  <title>Rishi | 3D Bot</title>

  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.92/build/spline-viewer.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    spline-viewer {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.35),
          transparent 25%,
          transparent 75%,
          rgba(0, 0, 0, 0.45)
        );
    }

    /* Top navigation */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 25px;

      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);

      border-bottom: 1px solid rgba(0, 255, 231, 0.12);
    }

    .logo {
      color: #fff;
      font-weight: 800;
      font-size: 1.15rem;
      text-decoration: none;
    }

    .logo span {
      color: #00ffe7;
    }

    .back-button {
      background: rgba(0, 255, 231, 0.9);
      color: #000;
      padding: 9px 17px;
      text-decoration: none;
      border-radius: 9px;
      font-weight: 800;
      transition: 0.3s;
    }

    .back-button:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 255, 231, 0.25);
    }

    /* Bottom information */
    .info {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 10;

      max-width: 350px;
      padding: 18px 20px;

      color: #fff;

      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 255, 231, 0.15);
      border-radius: 14px;

      backdrop-filter: blur(12px);
    }

    .info h2 {
      color: #00ffe7;
      margin-bottom: 4px;
      font-size: 1.2rem;
    }

    .info p {
      color: #aaa;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 14px 15px;
      }

      .info {
        left: 15px;
        right: 15px;
        bottom: 15px;
        max-width: none;
      }

      .back-button {
        padding: 8px 13px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>

  <spline-viewer
    url="https://prod.spline.design/L6L6NKiZzTc3dYHV/scene.splinecode">
  </spline-viewer>

  <div class="overlay"></div>

  <div class="topbar">

    <a href="index.html" class="logo">
      Rishi<span>.</span>
    </a>

    <a href="index.html" class="back-button">
      ← Back to Portfolio
    </a>

  </div>

  <div class="info">
    <h2>Interactive 3D Experience</h2>
    <p>
      Explore the 3D environment and return to the portfolio whenever you're ready.
    </p>
  </div>

</body>
</html>
